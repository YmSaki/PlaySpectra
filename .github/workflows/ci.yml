name: CI

# Gates the environment-independent control-plane and native-layer unit tests:
#   - Go     : control-plane compatibility suite + cgo-free build -- ubuntu/windows
#   - mcp/   : node:test suite for the pure quaternion/vector math (no layer, no socket) -- ubuntu
#   - layer/ : gtest suite for the pure helper functions (capture_common / pixel_convert /
#              pose_animator / dxgi_formats / action_helpers / pose_override + header-only
#              xr_math) -- windows, matching where these 92 tests are validated -- plus a build of
#              the playspectra_layer binary itself on windows and ubuntu (every dependency,
#              including Vulkan-Headers, is FetchContent-pinned, so a clean checkout must build).
#   - monado : build + stage-install of the Monado runtime + devicecore on both release
#              toolchains (MSVC windows / GCC ubuntu). No service run. See the job comment.
# Live E2E (Monado / real app / capture) is intentionally NOT here: it needs a GPU + a running
# service and cannot run on a hosted runner.

on:
  push:
    branches: [master]
  pull_request:
  workflow_call: # release.yml runs these same gates before producing any publishable artifact
    inputs:
      skip_monado_build:
        description: "Caller builds Monado itself; skip the duplicate monado-build job"
        type: boolean
        required: false
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mcp-tests:
    name: mcp unit tests (node:test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mcp/package-lock.json
      - run: npm ci
      - run: npm run build # tsc must compile; tsconfig excludes *.test.ts so dist stays test-free
      - run: npm test # node --import tsx --test "src/**/*.test.ts"

  go-tests:
    name: Go control plane (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache: true
      - run: go test ./...
      - run: go vet ./...
      # -o build/ is required, not cosmetic: the default output name collides with
      # the playspectra/ Go package directory, which fails outright on Linux
      # ("build output already exists and is a directory") and buries the binary
      # inside the source tree on Windows.
      - name: Build cgo-free control plane
        env:
          CGO_ENABLED: "0"
        run: go build -o build/ ./cmd/playspectra
      - name: Reject owned Python source or script runtime dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          tracked="$(git ls-files '*.py')"
          if [ -n "$tracked" ]; then
            echo "tracked Python source remains:"
            echo "$tracked"
            exit 1
          fi
          if git grep -nE '(^|[[:space:]])python[0-9]*([[:space:]]|$)|<<.*PY' -- 'scripts/*.sh'; then
            echo "owned shell scripts still invoke or embed Python"
            exit 1
          fi
          if git grep -nE '#cgo|(^|[[:space:]])import[[:space:]]+"C"|^[[:space:]]*"C"[[:space:]]*$' -- '*.go'; then
            echo "Go control plane must remain cgo-free"
            exit 1
          fi

  layer-tests:
    name: layer unit tests (gtest/ctest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # Configure with our host-unit-test knob on. The BUILD_TESTING=OFF seed in layer/CMakeLists.txt
      # keeps the fetched OpenXR SDK from registering its own loader_test; we still pass -E loader_test
      # below as belt-and-suspenders (a stale tree once leaked it as a "Not Run" ctest failure).
      # No -G pin: windows-latest rotates its VS version (2026-07 the image moved to
      # windows-2025-vs2026, VS2022 was removed and "Visual Studio 17 2022" stopped resolving).
      # cmake auto-detects the newest installed VS; the test build is generator-agnostic.
      - name: Configure
        run: cmake -S layer -B layer/build -DPLAYSPECTRA_BUILD_TESTS=ON
      # Only the test target here; the layer binary itself is covered by layer-build below.
      # FetchContent pulls googletest / OpenXR headers / nlohmann_json / lodepng.
      - name: Build playspectra_test
        run: cmake --build layer/build --config Release --target playspectra_test
      - name: Run tests
        run: ctest --test-dir layer/build -C Release -E loader_test --output-on-failure

  monado-build:
    name: Monado runtime build (${{ matrix.os }})
    # PR-time build + stage-install of the runtime with the same flags release.yml packages with.
    # Every release failure class so far was invisible until tag time because nothing in the PR
    # gate compiled or installed Monado on the release toolchains:
    #   rc1 linux   : missing include -- MSVC only warns on implicit declarations, GCC -Werrors
    #   rc2 windows : the runner's VS generation (newer than the dev boxes') dropped a header
    #   rc2 linux   : an install rule with an absolute DESTINATION escaping --prefix
    # The cmake --install step is load-bearing: it is what catches the rc2-linux class.
    # Skipped when release.yml calls this workflow -- its package jobs build the same tree.
    if: ${{ !inputs.skip_monado_build }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # one OS failing must not cancel (and thereby mask) the other's result
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install Monado build dependencies
        if: runner.os == 'Linux'
        # Same list as release.yml / docs/getting-started-linux.md (task setup:linux-deps).
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config glslang-tools \
            libvulkan-dev libeigen3-dev libcjson-dev \
            libx11-dev libx11-xcb-dev libxcb-randr0-dev libxrandr-dev libxxf86vm-dev \
            libgl1-mesa-dev libegl1-mesa-dev libglvnd-dev libwayland-dev wayland-protocols \
            libudev-dev libusb-1.0-0-dev libsdl2-dev libbsd-dev \
            libopenxr-dev libopenxr-loader1 mesa-vulkan-drivers
      - name: vcpkg binary cache
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: vcpkg-cache
          key: vcpkg-${{ runner.os }}-${{ hashFiles('runtime/monado-playspectra/vcpkg.json') }}
      - name: Configure + build + stage-install (Linux)
        if: runner.os == 'Linux'
        # Flag-for-flag and target-for-target the same as release.yml's Linux package job -- the
        # rationale comments live there.
        run: |
          cmake -S runtime/monado-playspectra -B build/monado -G Ninja \
            -DXRT_FEATURE_OPENVR=OFF -DXRT_FEATURE_STEAMVR_PLUGIN=OFF \
            -DXRT_MODULE_MONADO_GUI=OFF \
            -DXRT_BUILD_DRIVER_PLAYSPECTRA=ON -DXRT_MODULE_MONADO_CLI=ON
          cmake --build build/monado --parallel --target monado-service cli openxr_monado monado-ctl
          cmake --install build/monado --prefix stage/smoke
      - name: Configure + build + stage-install (Windows)
        if: runner.os == 'Windows'
        shell: bash
        env:
          VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/vcpkg-cache,readwrite"
        # Flag-for-flag the same as release.yml's Windows package job (no monado-ctl: targets/ctl
        # is non-Windows) -- the rationale comments live there.
        run: |
          cmake -S runtime/monado-playspectra -B build/monado -A x64 \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_MANIFEST_NO_DEFAULT_FEATURES=ON \
            -DXRT_FEATURE_OPENVR=OFF -DXRT_FEATURE_STEAMVR_PLUGIN=OFF \
            -DXRT_MODULE_MONADO_GUI=OFF \
            -DXRT_BUILD_DRIVER_PLAYSPECTRA=ON -DXRT_MODULE_MONADO_CLI=ON
          cmake --build build/monado --config Release --target monado-service cli openxr_monado
          cmake --install build/monado --config Release --prefix stage/smoke
      # Same machine check as the release package smoke. rc1/rc2 never reached that step on
      # either OS, so without this the first-ever run of the packaged probe would be at tag time.
      - name: Staged probe smoke
        if: runner.os == 'Windows'
        shell: bash
        env:
          PLAYSPECTRA_ENABLE: "1"
        # 2>&1 is load-bearing: Monado's logging (the device enumeration included) goes to
        # stderr; probe's stdout never contains the device names (measured, not assumed).
        run: ./stage/smoke/bin/monado-cli.exe probe 2>&1 | grep "PlaySpectra HMD"
      - name: Staged probe smoke
        if: runner.os == 'Linux'
        env:
          PLAYSPECTRA_ENABLE: "1"
        run: |
          set -euo pipefail
          CLI="$(find stage/smoke -name monado-cli -type f | head -1)"
          test -n "$CLI"
          "$CLI" probe 2>&1 | grep "PlaySpectra HMD" # 2>&1: Monado logs the enumeration to stderr

  layer-build:
    name: layer binary build (${{ matrix.os }})
    # Proves a clean checkout can build the shippable playspectra_layer DLL/.so -- the gap that
    # let the untracked third_party/Vulkan-Headers dependency go unnoticed (issue #11): the test
    # target above never compiles the Vulkan capture backend, so only this job exercises the
    # FetchContent pin of Vulkan-Headers on a machine with no local checkout.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false # one OS failing must not cancel (and thereby mask) the other's result
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      # The fetched OpenXR SDK's configure demands an xlib presentation backend on Linux
      # (src/cmake/presentation.cmake FATAL_ERRORs without the X11 dev headers). Same packages as
      # the documented Linux prerequisites in docs/getting-started-linux.md, X/GL subset only.
      - name: Install X11/GL dev headers (OpenXR SDK configure)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libx11-dev libx11-xcb-dev libxcb-randr0-dev libxrandr-dev libxxf86vm-dev libgl1-mesa-dev
      - name: Configure
        run: cmake -S layer -B layer/build
      - name: Build playspectra_layer
        run: cmake --build layer/build --config Release --target playspectra_layer
